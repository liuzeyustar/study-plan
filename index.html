<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>课程任务 · Study Plan</title>
<style>
  :root {
    --bg: #0b0b0d;
    --bg-2: #111114;
    --surface: #16161a;
    --surface-2: #1c1c21;
    --surface-h: #222228;
    --border: #2a2a31;
    --border-2: #34343d;
    --text: #eef0f3;
    --text-2: #b4b7bf;
    --text-3: #7a7e89;
    --accent: #34d399;
    --accent-2: #6ee7b7;
    --accent-dim: rgba(52, 211, 153, 0.14);
    --danger: #f87171;
    --warn: #fbbf24;
    --radius: 12px;
    --radius-s: 8px;
    --shadow: 0 1px 0 rgba(255,255,255,0.03) inset, 0 8px 24px -12px rgba(0,0,0,0.6);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  button { font-family: inherit; color: inherit; cursor: pointer; border: none; background: none; }
  input { font-family: inherit; color: inherit; border: none; background: none; outline: none; }
  ::selection { background: var(--accent-dim); color: var(--accent-2); }

  .app {
    display: grid;
    grid-template-columns: 232px 1fr;
    height: 100vh;
  }

  /* ---------- Sidebar ---------- */
  .sidebar {
    background: var(--bg-2);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 18px 14px;
    gap: 18px;
  }
  .brand {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.01em;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 6px 4px;
  }
  .brand .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent);
  }
  .tabs {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .tab {
    text-align: left;
    padding: 8px 10px;
    border-radius: var(--radius-s);
    color: var(--text-2);
    font-size: 13px;
    font-weight: 500;
    transition: background .15s, color .15s;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .tab:hover { background: var(--surface); color: var(--text); }
  .tab.active { background: var(--surface-2); color: var(--text); }
  .tab .count {
    margin-left: auto;
    font-size: 11px;
    color: var(--text-3);
    background: var(--surface);
    padding: 1px 7px;
    border-radius: 999px;
  }
  .tab.active .count { background: var(--accent-dim); color: var(--accent-2); }

  .courses-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-3);
    padding: 0 6px 4px 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .add-course-btn {
    font-size: 16px;
    line-height: 1;
    color: var(--text-3);
    padding: 2px 7px;
    border-radius: 5px;
    text-transform: none;
    letter-spacing: 0;
    transition: background .12s, color .12s;
  }
  .add-course-btn:hover { background: var(--surface); color: var(--accent-2); }
  .courses-rail {
    display: flex;
    flex-direction: column;
    gap: 2px;
    overflow-y: auto;
    flex: 1;
    padding-bottom: 4px;
  }
  .course-chip {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 4px 10px;
    min-height: 27px;
    border-radius: 6px;
    cursor: pointer;
    transition: background .15s;
  }
  .course-chip:hover { background: var(--surface); }
  .course-chip.active { background: var(--surface-2); }
  .course-chip .swatch {
    width: 6px; height: 6px; border-radius: 50%;
    flex-shrink: 0;
  }
  .course-chip .cshort { font-size: 12.5px; color: var(--text-2); white-space: nowrap; }
  .course-chip:hover .cshort,
  .course-chip.active .cshort { color: var(--text); }

  .sidebar-footer {
    display: flex;
    flex-direction: column;
    gap: 6px;
    border-top: 1px solid var(--border);
    padding-top: 12px;
  }
  .date-row { display: flex; gap: 6px; }
  .date-row input[type="date"] {
    flex: 1; min-width: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-s);
    padding: 7px 8px;
    font-size: 12px;
    color: var(--text-2);
    font-family: inherit;
  }
  .date-row input[type="date"]:focus { border-color: var(--accent); outline: none; }
  .date-row .btn { flex-shrink: 0; padding: 7px 11px; }
  .btn {
    padding: 8px 12px;
    border-radius: var(--radius-s);
    font-size: 12.5px;
    font-weight: 500;
    transition: background .15s, transform .1s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: var(--accent); color: #052e22; }
  .btn-primary:hover { background: var(--accent-2); }
  .btn-ghost { background: var(--surface); color: var(--text-2); }
  .btn-ghost:hover { background: var(--surface-h); color: var(--text); }

  /* ---------- Main ---------- */
  .main {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 22px 32px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
  }
  .date-block .date-large {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  .date-block .date-sub {
    font-size: 12.5px;
    color: var(--text-3);
    margin-top: 2px;
  }
  .progress-block {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 18px 10px 12px;
  }
  .sync-block {
    display: flex;
    align-items: center;
    gap: 9px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 8px 14px;
    margin-left: 12px;
  }
  .sync-state {
    font-size: 12px;
    color: var(--text-3);
    max-width: 74px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .sync-dot-btn {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: #9ca3af;              /* 灰：未连接 */
    flex-shrink: 0;
  }
  .sync-dot-btn.sync-loading { background: #fbbf24; animation: sync-pulse 1s infinite; }
  .sync-dot-btn.sync-ok      { background: #34d399; }
  .sync-dot-btn.sync-error   { background: #ef4444; }
  @keyframes sync-pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
  .ring {
    --p: 0;
    width: 44px; height: 44px;
    border-radius: 50%;
    background:
      conic-gradient(var(--accent) calc(var(--p) * 1%), var(--surface-2) 0);
    display: grid;
    place-items: center;
    position: relative;
  }
  .ring::after {
    content: '';
    position: absolute;
    inset: 4px;
    border-radius: 50%;
    background: var(--surface);
  }
  .ring span {
    position: relative;
    z-index: 1;
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
  }
  .progress-meta .pct { font-size: 15px; font-weight: 600; }
  .progress-meta .pdesc { font-size: 11.5px; color: var(--text-3); margin-top: 1px; }

  .views {
    flex: 1;
    overflow-y: auto;
    padding: 24px 32px 40px;
  }
  .view { display: none; animation: fade .25s ease; }
  .view.active { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px);} to { opacity: 1; transform: none; } }

  .section-title {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-3);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* ---------- Today view ---------- */
  .day-classes { display: flex; flex-direction: column; gap: 14px; }
  .class-block {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  /* 从课表跳转过来时高亮该节课 */
  @keyframes flashHighlight {
    0%   { box-shadow: 0 0 0 0 rgba(52,211,153,0); }
    22%  { box-shadow: 0 0 0 4px rgba(52,211,153,0.4); }
    100% { box-shadow: 0 0 0 0 rgba(52,211,153,0); }
  }
  .class-block.flash { animation: flashHighlight 1.5s ease; }
  .class-head {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
  }
  .class-head .stripe {
    width: 3px; height: 32px; border-radius: 2px;
  }
  .class-head .ctime {
    font-size: 12px;
    color: var(--text-3);
    font-variant-numeric: tabular-nums;
    min-width: 92px;
  }
  .class-head .cname { font-size: 15px; font-weight: 600; }
  .class-head .cmeta { font-size: 12px; color: var(--text-3); margin-left: auto; display: flex; gap: 12px; }
  .class-tasks { padding: 8px 12px 12px; display: flex; flex-direction: column; gap: 2px; }
  .task-row {
    display: block;
    padding: 6px;
    border-radius: 6px;
    transition: background .12s;
  }
  .task-row:hover { background: var(--surface-2); }
  .task-line { display: flex; align-items: center; gap: 10px; }
  .task-note {
    font-size: 11.5px;
    color: var(--text-3);
    line-height: 1.5;
    min-height: 17px;
    padding: 1px 4px 1px 27px;
    border-radius: 4px;
    outline: none;
    overflow-wrap: anywhere;
    transition: background .12s, color .12s;
  }
  .task-note.empty::before { content: attr(data-ph); opacity: 0; transition: opacity .15s; }
  .task-row:hover .task-note.empty::before,
  .lt-row:hover .task-note.empty::before { opacity: .55; }
  .task-note:focus { background: var(--surface); color: var(--text); }
  .chk {
    width: 17px; height: 17px;
    border: 1.5px solid var(--border-2);
    border-radius: 4px;
    flex-shrink: 0;
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: all .15s;
  }
  .chk:hover { border-color: var(--accent); }
  .chk.checked { background: var(--accent); border-color: var(--accent); }
  .chk.checked::after {
    content: '';
    width: 4px; height: 8px;
    border: solid #052e22;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg) translate(-1px, -1px);
  }
  .task-title {
    flex: 1;
    min-width: 0;          /* 允许收缩，避免长标题把日期挤出可视区 */
    font-size: 13.5px;
    color: var(--text);
    outline: none;
    overflow-wrap: anywhere;
  }
  .task-title[contenteditable="true"]:focus { background: var(--surface-2); border-radius: 4px; padding: 1px 4px; }
  .task-row.done .task-title { color: var(--text-3); text-decoration: line-through; }
  .task-tag {
    flex-shrink: 0;
    font-size: 10.5px;
    padding: 2px 7px;
    border-radius: 999px;
    font-weight: 500;
  }
  .tag-hw { background: rgba(96,165,250,0.14); color: #93c5fd; }
  .tag-review { background: rgba(167,139,250,0.14); color: #c4b5fd; }
  .tag-long { background: rgba(148,163,184,0.16); color: #cbd5e1; }
  .tag-task { background: rgba(52,211,153,0.14); color: #6ee7b7; }
  .task-del {
    flex-shrink: 0;
    color: var(--text-3);
    opacity: 0;
    transition: opacity .15s;
    font-size: 15px;
    padding: 0 4px;
  }
  .task-row:hover .task-del { opacity: 1; }
  .task-del:hover { color: var(--danger); }

  .task-due {
    display: inline-flex;
    align-items: center;
    flex-shrink: 0;
    font-size: 11px;
    color: var(--text-3);
    padding: 2px 7px;
    border: 1px solid var(--border);
    border-radius: 5px;
    cursor: pointer;
    font-variant-numeric: tabular-nums;
    transition: background .12s, border-color .12s, color .12s;
  }
  .task-due:hover { background: var(--surface-2); border-color: var(--border-2); color: var(--text); }
  .task-due.soon { color: var(--warn); }
  .task-due.overdue { color: var(--danger); }
  .task-due input[type="date"] {
    background: transparent;
    border: none;
    outline: none;
    color: inherit;
    font-size: 11px;
    font-family: inherit;
    width: 106px;
    padding: 0;
    margin: 0;
    cursor: pointer;
  }
  .task-due input[type="date"]::-webkit-calendar-picker-indicator { opacity: .5; cursor: pointer; }
  .task-due input[type="date"]::-webkit-calendar-picker-indicator:hover { opacity: 1; }
  .lt-due input {
    background: transparent;
    border: none;
    outline: none;
    color: inherit;
    font-size: 11px;
    font-family: inherit;
    width: 106px;
    padding: 0;
    margin: 0;
    cursor: pointer;
  }
  .lt-due input::-webkit-calendar-picker-indicator { opacity: .5; cursor: pointer; }
  .lt-due input::-webkit-calendar-picker-indicator:hover { opacity: 1; }

  .add-task-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 6px 2px;
    color: var(--text-3);
    font-size: 12.5px;
    cursor: pointer;
    border-radius: 6px;
  }
  .add-task-row:hover { color: var(--accent-2); background: var(--surface-2); }
  .add-task-row .plus { font-size: 15px; line-height: 1; }

  .empty-day {
    text-align: center;
    padding: 48px 20px;
    color: var(--text-3);
    background: var(--surface);
    border: 1px dashed var(--border);
    border-radius: var(--radius);
  }

  /* 今日概览统计条 */
  .stat-strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
  }
  .stat .n { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat .l { font-size: 11px; color: var(--text-3); margin-top: 2px; }

  .lt-due {
    display: inline-flex; align-items: center; flex-shrink: 0;
    font-size: 11px; color: var(--text-3);
    padding: 2px 7px; border: 1px solid var(--border); border-radius: 5px;
    cursor: pointer; font-variant-numeric: tabular-nums;
    transition: background .12s, border-color .12s, color .12s;
  }
  .lt-due:hover { background: var(--surface-2); border-color: var(--border-2); color: var(--text); }
  .lt-due.soon { color: var(--warn); }
  .lt-due.overdue { color: var(--danger); }
  .pri-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .pri-high { background: var(--danger); }
  .pri-med { background: var(--warn); }
  .pri-low { background: var(--text-3); }

  /* ---------- 即将到期 ---------- */
  .due-group { margin-bottom: 22px; }
  .due-group-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .due-group-head .dg-name { font-size: 13px; font-weight: 600; color: var(--text-2); }
  .due-group-head .dg-name.overdue { color: var(--danger); }
  .due-group-head .dg-name.today { color: var(--accent-2); }
  .due-group-head .dg-name.soon { color: var(--warn); }
  .due-group-head .dg-count {
    font-size: 11px; color: var(--text-3);
    background: var(--surface-2); padding: 1px 8px; border-radius: 999px;
  }
  .archive-head { cursor: pointer; user-select: none; }
  .archive-head:hover .dg-name { color: var(--text); }
  .archive-caret { color: var(--text-3); font-size: 11px; transition: transform .15s; }
  .archive-tip { font-size: 10.5px; color: var(--text-3); margin-left: auto; }
  .due-list {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 8px 12px;
    display: flex; flex-direction: column; gap: 2px;
  }
  .due-days {
    flex-shrink: 0;
    font-size: 10.5px;
    color: var(--text-3);
    padding: 1px 7px;
    border-radius: 999px;
    background: var(--surface-2);
    white-space: nowrap;
  }
  .due-days.overdue { color: #fca5a5; background: rgba(248,113,113,0.14); }
  .due-days.today { color: var(--accent-2); background: var(--accent-dim); }
  .due-days.soon { color: var(--warn); background: rgba(251,191,36,0.12); }
  .due-empty {
    text-align: center; padding: 40px 20px; color: var(--text-3);
    background: var(--surface); border: 1px dashed var(--border); border-radius: var(--radius);
  }

  /* ---------- Schedule view ---------- */
  .week-grid {
    display: grid;
    grid-template-columns: 56px repeat(7, 1fr);
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .wk-head {
    background: var(--surface);
    padding: 10px 4px;
    text-align: center;
    font-size: 12px;
    color: var(--text-3);
    font-weight: 500;
  }
  .wk-head.today { color: var(--accent-2); background: var(--accent-dim); }
  .wk-time {
    background: var(--surface);
    padding: 8px 4px;
    text-align: center;
    font-size: 11px;
    color: var(--text-3);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .wk-cell {
    background: var(--surface);
    min-height: 64px;
    padding: 4px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .wk-cell.today { background: rgba(52,211,153,0.04); }
  .wk-slot {
    background: var(--surface-2);
    border-left: 3px solid;
    border-radius: 5px;
    padding: 5px 7px;
    font-size: 11px;
    line-height: 1.3;
    cursor: pointer;
    transition: transform .1s;
  }
  .wk-slot:hover { transform: translateX(2px); }
  .wk-slot .ws-time { color: var(--text-3); font-size: 10px; }
  .wk-slot .ws-name { color: var(--text); font-weight: 500; }

  /* ---------- 长期任务列表（课程视图内） ---------- */
  .lt-list { display: flex; flex-direction: column; gap: 2px; }
  .lt-row {
    display: block;
    padding: 7px 12px;
    border-radius: var(--radius-s);
    transition: background .12s;
  }
  .lt-row:hover { background: var(--surface); }
  .lt-line { display: flex; align-items: center; gap: 12px; }
  .lt-row .lt-title { flex: 1; min-width: 0; font-size: 13.5px; overflow-wrap: anywhere; }
  .lt-row.done .lt-title { color: var(--text-3); text-decoration: line-through; }
  .lt-row .task-note { padding-left: 29px; }
  .lt-course-tag {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--surface-2);
    color: var(--text-2);
  }

  /* ---------- 即将到期 列表行 ---------- */
  .due-row {
    display: block;
    padding: 8px 4px;
    border-bottom: 1px solid var(--border);
  }
  .due-row:last-child { border-bottom: none; }
  .due-line { display: flex; align-items: center; gap: 10px; }
  .due-row .due-title {
    flex: 1; min-width: 0; font-size: 13.5px;
    color: var(--text); outline: none; overflow-wrap: anywhere;
  }
  .due-row .task-note { padding-left: 27px; }
  .due-row .task-note.empty { display: none; }
  .due-row.done .due-title { color: var(--text-3); text-decoration: line-through; }
  .due-row .due-title[contenteditable="true"]:focus {
    background: var(--surface-2); border-radius: 4px; padding: 1px 4px;
  }

  /* ---------- 提醒按钮 ---------- */
  .remind-btn {
    display: inline-flex; align-items: center; gap: 4px;
    flex-shrink: 0;
    font-size: 12px;
    color: var(--text-3);
    padding: 2px 6px;
    border: 1px solid var(--border);
    border-radius: 5px;
    cursor: pointer;
    background: none;
    transition: border-color .12s, color .12s, background .12s;
  }
  .remind-btn:hover { border-color: var(--border-2); color: var(--text); background: var(--surface-2); }
  .remind-btn.on { color: var(--warn); border-color: rgba(251,191,36,0.4); background: rgba(251,191,36,0.1); }
  .remind-btn .rb-label { font-size: 10px; font-weight: 600; }

  /* ---------- 今日计划 ---------- */
  .plan-bar {
    flex-shrink: 0;               /* 固定高度，不随滚动 */
    padding: 12px 32px 0;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }
  .plan-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
  }
  .plan-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }

let cloudReady = false;   // 首次云端拉取完成前，不自动推，避免覆盖云端数据

function setSyncStatus(s) {
  const dot = document.getElementById('sync-dot');
  const txt = document.getElementById('sync-state');
  if (dot) dot.className = 'sync-dot-btn' + (s === 'off' ? '' : ' sync-' + s);
  const map = { off: '未连接', loading: '同步中…', ok: '已同步', error: '同步失败' };
  if (txt) txt.textContent = map[s] || '';
}

async function fetchRemote() {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/plan_state?id=eq.main&select=data`, {
    headers: { apikey: SUPABASE_ANON, Authorization: `Bearer ${SUPABASE_ANON}` }
  });
  if (!r.ok) throw new Error('fetch ' + r.status);
  const arr = await r.json();
  return arr.length ? arr[0].data : null;
}

async function pushRemote() {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/plan_state?on_conflict=id`, {
    method: 'POST',
    headers: {
      apikey: SUPABASE_ANON, Authorization: `Bearer ${SUPABASE_ANON}`,
      'Content-Type': 'application/json', Prefer: 'resolution=merge-duplicates,return=minimal'

    body: JSON.stringify({ id: 'main', data: state })
  });
  if (!r.ok) throw new Error('push ' + r.status);
}

function schedulePush() {
  if (!cloudReady) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(pushNow, 800);
}

async function pushNow() {
  clearTimeout(syncTimer);
  setSyncStatus('loading');
  try {
    state.cloudT = Date.now();
    await pushRemote();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    setSyncStatus('ok');
  } catch (e) { setSyncStatus('error'); }
}

// 完整同步一次：先读云端，再决定采纳本地或云端（以 cloudT 时间戳做最后写入者胜出）
async function syncNow() {
  clearTimeout(syncTimer);
  setSyncStatus('loading');
  try {
    const remote = await fetchRemote();

      // 云端比本地新，采用云端

      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      pruneTasks(); backfillWeek(); render(); checkReminders();
      toast('已从云端同步最新数据');
    } else {
      // 本地为最新（或云端为空），上传本地

      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      if (remote) toast('本地数据已同步到云端'); else toast('已同步到云端');

    cloudReady = true;

// 周数字符串解析，如 "第2-5周,第7-18周" -> [2,3,4,5,7,8,...,18]
function parseWeeks(str) {
  const weeks = new Set();
  str.split(/[,，]/).forEach(part => {
    const m = part.match(/(\d+)(?:-(\d+))?/);
    if (!m) return;
    const a = parseInt(m[1]);
    const b = m[2] ? parseInt(m[2]) : a;
    for (let w = a; w <= b; w++) weeks.add(w);
  });
  return [...weeks];
}

// 保证「短期任务只属于今天及以前」，且只有开启自动生成的课程才有自动任务
function pruneTasks() {
  const today = todayStr();
  const autoIds = new Set(state.courses.filter(c => autoGenOf(c)).map(c => c.id));
  let removed = 0;
  Object.keys(state.shortTerm).forEach(d => {
    if (d > today) { delete state.shortTerm[d]; removed++; return; }
    const before = state.shortTerm[d].length;
    state.shortTerm[d] = state.shortTerm[d].filter(t => !(t._auto && !autoIds.has(t.courseId)));
    removed += before - state.shortTerm[d].length;
    if (state.shortTerm[d].length === 0) { delete state.shortTerm[d]; removed++; }
  });
  if (removed) save();
  return removed;
}

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultState();
    const s = JSON.parse(raw);
    // 旧版数据（没有 week1Start 或 slots）需重置为新课表
    if (!s.week1Start || !s.courses?.[0]?.slots) return defaultState();
    s.selectedCourse = null;    // 每次加载不恢复课程视图
    s.currentDate = todayStr(); // 关键：日期始终取系统当天，保证每天自动更新
    s.viewPinned = false;
    if (!s.genSkip) s.genSkip = {};
    if (!s.plans) s.plans = {};
    if (!s.notified) s.notified = {};
    return s;
  } catch { return defaultState(); }
}
function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); schedulePush(); }

/* ===================== Utils ===================== */
function toDateStr(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function todayStr() {
  return toDateStr(new Date());
}
function addDaysStr(n) {
  const d = new Date();
  d.setDate(d.getDate() + n);
  return toDateStr(d);
}
function weekdayOf(dateStr) {
  // JS: 0=Sun..6=Sat  ->  1=Mon..7=Sun
  const d = new Date(dateStr + 'T00:00:00');
  const j = d.getDay();
  return j === 0 ? 7 : j;
}
function uid() { return Math.random().toString(36).slice(2, 9); }
function courseById(id) { return state.courses.find(c => c.id === id); }
function fmtDateCN(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const wd = ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
  return `${d.getMonth()+1}月${d.getDate()}日 · ${wd}`;
}
// 根据日期计算教学周次（week1Start 为第1周周一）
function weekOf(dateStr) {
  const start = new Date(state.week1Start + 'T00:00:00');
  const cur = new Date(dateStr + 'T00:00:00');
  const diff = Math.floor((cur - start) / 86400000);
  return Math.floor(diff / 7) + 1;
}
// 获取某天有课的课程（考虑周次），返回 [{course, slot, start, end}]
function classesOnDay(dateStr) {
  const wd = weekdayOf(dateStr);
  const wk = weekOf(dateStr);
  const result = [];
  state.courses.forEach(c => {
    c.slots.forEach(slot => {
      if (slot.day === wd && slot.weeks.includes(wk)) {
        const [start, end] = PERIOD_TIMES[slot.period] || ['00:00','00:00'];
        result.push({ course: c, slot, start, end });
      }
    });
  });
  result.sort((a, b) => a.start.localeCompare(b.start));
  return result;
}
// 判断某门课是否需要复习任务（数学/物理需要，英语/人文不需要）
function needsReview(course) {
  return course.category === 'math' || course.category === 'physics';
}
// 是否自动生成课后任务：默认只有数学/物理类开启，可在课程管理里逐门覆盖
function autoGenOf(course) {
  return typeof course.autoGen === 'boolean'
    ? course.autoGen
    : (course.category === 'math' || course.category === 'physics');
}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._tid);
  t._tid = setTimeout(() => t.classList.remove('show'), 2000);
}

/* ===================== Daily generation ===================== */
// 用户手动删掉某个「课程 + 日期」的自动任务后，记一个标记，之后不再自动补回来
function genKey(dateStr, courseId) { return dateStr + '_' + courseId; }
function isGenSkipped(dateStr, courseId) {
  return !!(state.genSkip && state.genSkip[genKey(dateStr, courseId)]);
}
function markGenSkipped(dateStr, courseId) {
  if (!state.genSkip) state.genSkip = {};
  state.genSkip[genKey(dateStr, courseId)] = true;
}

function ensureDayTasks(dateStr) {
  const classes = classesOnDay(dateStr);
  const list = state.shortTerm[dateStr] ? [...state.shortTerm[dateStr]] : [];
  let added = 0;
  classes.forEach(({ course }) => {
    if (!autoGenOf(course)) return;                       // 只有开启自动生成的课程才生成
    if (isGenSkipped(dateStr, course.id)) return;         // 用户删过，不要重新生成
    const has = list.some(t => t.courseId === course.id && t._auto);
    if (!has) {
      list.push({ id: uid(), courseId: course.id, type: 'homework', title: '完成课后作业', done: false, due: dateStr, _auto: true });
      added++;
      if (needsReview(course)) {
        list.push({ id: uid(), courseId: course.id, type: 'review', title: '复习本节课笔记，整理重点', done: false, due: dateStr, _auto: true });
        added++;
      }
    }
  });
  // 只有真正生成了任务才落库，避免留下空的日期键
  if (added) { state.shortTerm[dateStr] = list; save(); }
}

// 回填本周（周一至当前日期）的任务：即使某天才打开页面，
// 本周已上过课程的作业/复习也会补上，避免课程视图为空
function backfillWeek() {
  const today = todayStr();
  // 只生成「已经发生过」的日期，避免预览未来日期时凭空造出任务
  const end = state.currentDate < today ? state.currentDate : today;
  const d = new Date(end + 'T00:00:00');
  const wd = d.getDay();                       // 0=周日
  const offsetToMonday = wd === 0 ? 6 : wd - 1; // 距本周一的天数
  const monday = new Date(d);
  monday.setDate(d.getDate() - offsetToMonday);
  for (let i = 0; i <= offsetToMonday; i++) {
    const cur = new Date(monday);
    cur.setDate(monday.getDate() + i);
    ensureDayTasks(toDateStr(cur));
  }
}

// 切换查看的日期；pinned=true 表示用户手动选的日期，之后不再自动跟随系统日期
function setViewDate(dateStr, pinned) {
  state.currentDate = dateStr;
  state.viewPinned = !!pinned;
  backfillWeek();
  save();
  render();
}

function renderToday() {
  const classes = classesOnDay(state.currentDate);
  const tasks = state.shortTerm[state.currentDate] || [];

  // 今天有任务、但当天没课的单位（例如学生工作）也单独成块显示
  const shownIds = new Set(classes.map(x => x.course.id));
  const extras = [];
  tasks.forEach(t => {
    if (shownIds.has(t.courseId)) return;
    const c = courseById(t.courseId);
    if (c && !extras.some(x => x.id === c.id)) extras.push(c);
  });

  const blocks = classes
    .map(({ course: c, start, end }) => dayBlockHTML(c, `${start} – ${end}`, tasks))
    .concat(extras.map(c => dayBlockHTML(c, '', tasks)));

  document.getElementById('day-classes').innerHTML = blocks.length
    ? blocks.join('')
    : `<div class="empty-day">今天没有课，也没有任务 ☕</div>`;

  // stats
  document.getElementById('st-classes').textContent = classes.length;
  document.getElementById('st-tasks').textContent = tasks.length;
  const done = tasks.filter(t=>t.done).length;
  document.getElementById('st-done').textContent = done;
  document.getElementById('st-left').textContent = tasks.length - done;
}

function dueClass(due) {
  const today = state.currentDate;
  const diff = (new Date(due) - new Date(today)) / 86400000;
  if (diff < 0) return 'overdue';
  if (diff <= 3) return 'soon';
  return '';
}

// 任务类型标签：作业 / 复习 / 任务（学生工作用）
const TASK_TYPES = {
  homework: { label: '作业', cls: 'tag-hw' },
  review:   { label: '复习', cls: 'tag-review' },
  task:     { label: '任务', cls: 'tag-task' },
};
function typeTagHTML(type) {

  return `<span class="task-tag ${t.cls}">${t.label}</span>`;
}

// 备注行（ph 传入时，空白状态会在悬停时显示浅色提示）
function noteHTML(kind, id, note, ph) {
  return `<div class="task-note ${note ? '' : 'empty'}"${ph ? ` data-ph="${ph}"` : ''} contenteditable="true" onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur();}" onblur="commitNote(this,'${kind}','${id}')">${note || ''}</div>`;
}

function taskRowHTML(t) {
  const due = t.due || state.currentDate;
  const cls = dueClass(due);
  return `
    <div class="task-row ${t.done?'done':''}">
      <div class="task-line">

        <span class="chk ${t.done?'checked':''}" onclick="toggleShortTerm('${t.id}')"></span>

        ${typeTagHTML(t.type)}

          <input type="date" value="${due}" onchange="setShortTermDue('${t.id}', this.value)"/>
        </span>
        <span class="task-del" onclick="delShortTerm('${t.id}')">×</span>
      </div>
      ${noteHTML('short', t.id, t.note, '添加备注…')}

function renderSchedule() {
  const grid = document.getElementById('week-grid');
  const dayNames = ['周一','周二','周三','周四','周五','周六','周日'];
  const wk = weekOf(state.currentDate);
  const todayWd = weekdayOf(state.currentDate);

  // 本周每一列对应的真实日期，供点击跳转使用
  const base = new Date(state.currentDate + 'T00:00:00');
  const baseWd = base.getDay();
  const monday = new Date(base);
  monday.setDate(base.getDate() - (baseWd === 0 ? 6 : baseWd - 1));
  const dayDates = {};
  for (let d = 1; d <= 7; d++) {
    const cur = new Date(monday);
    cur.setDate(monday.getDate() + d - 1);
    dayDates[d] = toDateStr(cur);
  }

  // 收集本周每天的课程 {course, start, end}
  const byDay = {};
  for (let d = 1; d <= 7; d++) byDay[d] = [];
  state.courses.forEach(c => {
    c.slots.forEach(slot => {
      if (slot.weeks.includes(wk) && byDay[slot.day]) {
        const [start, end] = PERIOD_TIMES[slot.period] || ['00:00','00:00'];
        byDay[slot.day].push({ course: c, start, end });
      }
    });
  });
  Object.values(byDay).forEach(arr => arr.sort((a,b)=>a.start.localeCompare(b.start)));

  // 时间行（取所有时间段的起始时间，去重排序）
  const timeRows = [...new Set(Object.values(PERIOD_TIMES).map(p=>p[0]))].sort();

  let html = `<div class="wk-head" style="font-size:11px">第${wk}周</div>`;
  for (let i=0;i<7;i++) {
    html += `<div class="wk-head ${i+1===todayWd?'today':''}">${dayNames[i]}</div>`;
  }
  timeRows.forEach(t => {
    html += `<div class="wk-time">${t}</div>`;
    for (let d=1; d<=7; d++) {
      const cells = byDay[d].filter(x => x.start === t);
      html += `<div class="wk-cell ${d===todayWd?'today':''}">`;
      cells.forEach(({course, start, end}) => {
        html += `<div class="wk-slot" style="border-left-color:${course.color}" title="查看这节课的任务" onclick="gotoClassTasks('${dayDates[d]}','${course.id}')">
          <div class="ws-time">${start}–${end}</div>
          <div class="ws-name">${course.short}</div>
        </div>`;
      });
      html += `</div>`;
    }
  });
  grid.innerHTML = html;
}

// 汇总所有任务（短期 + 长期），供「即将到期」使用
function collectAllTasks() {
  const list = [];
  Object.entries(state.shortTerm).forEach(([date, arr]) => {
    arr.forEach(t => list.push({ ...t, kind: 'short', date }));
  });
  state.longTerm.forEach(l => list.push({ ...l, kind: 'long' }));
  return list;
}

// 按 id 定位任意任务（短期或长期），返回 { t, kind, date }
function findAnyTask(id) {
  const st = Object.entries(state.shortTerm);
  for (let i = 0; i < st.length; i++) {
    const [date, arr] = st[i];
    const found = arr.find(x => x.id === id);
    if (found) return { t: found, kind: 'short', date };
  }
  const lt = state.longTerm.find(x => x.id === id);
  if (lt) return { t: lt, kind: 'long' };
  return null;
}

/* ===================== 提醒 / 闹钟 ===================== */
const REMIND_OPTS = [null, 0, 1, 3];          // 无 / 截止当天 / 提前1天 / 提前3天
const REMIND_LABEL = { 0: '当天', 1: '提前1天', 3: '提前3天' };
// 提醒按钮：点击在「无 → 当天 → 提前1天 → 提前3天」间循环
function remindHTML(id, remind) {
  const active = remind != null;
  return `<button class="remind-btn ${active ? 'on' : ''}" title="截止提醒：${active ? REMIND_LABEL[remind] : '未设置'}（点击切换）" onclick="cycleRemind('${id}')">${active ? `<span class="rb-label">${REMIND_LABEL[remind]}</span>` : ''}⏰</button>`;
}
function cycleRemind(id) {
  const r = findAnyTask(id);
  if (!r) return;
  const cur = REMIND_OPTS.indexOf(r.t.remind ?? null);
  const next = REMIND_OPTS[(cur + 1) % REMIND_OPTS.length];
  r.t.remind = next;
  if (next != null && 'Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
  }
  save(); render();
}
// 遍历所有任务，检查是否该发提醒（浏览器通知）
function checkReminders() {
  if (!('Notification' in window)) return;
  const today = todayStr();
  const isDueToday = t => !t.due || t.due === today;
  const dayDiff = due => !due ? 0 : Math.round((new Date(due + 'T00:00:00') - new Date(today + 'T00:00:00')) / 86400000);
  collectAllTasks().forEach(t => {
    if (t.done) return;                       // 已完成不提醒
    if (t.remind == null) return;             // 未设置提醒
    const diff = dayDiff(t.due);
    const fire = t.remind === 0 ? isDueToday(t) : diff === t.remind; // 提前N天或当天
    if (!fire) return;
    // 用「任务id+截止日期」去重，避免每次刷新都重复弹
    const k = `${t.id}|${t.due}`;
    if (state.notified[k]) return;
    state.notified[k] = true; save();
    const c = t.courseId ? courseById(t.courseId) : null;
    const tag = c ? `【${c.short}】` : '';
    const body = `${tag}「${t.title}」今天到期,别忘了处理`;
    if (Notification.permission === 'granted') {
      try { new Notification('📌 任务截止提醒', { body }); return; } catch (e) {}
    }
    toast('⏰ ' + body);
  });
}

/* ===================== 今日计划（拖动待办 + 新建 + 打勾） ===================== */
// 手动拖拽（不用浏览器原生 DnD，避免 contenteditable 抢占拖动）
function startPlanDrag(ev, id) {
  ev.preventDefault();
  // 创建跟随鼠标的幽灵元素
  const ghost = document.createElement('div');
  ghost.className = 'plan-ghost';
  ghost.textContent = '＋';
  ghost.style.left = (ev.clientX + 8) + 'px';
  ghost.style.top = (ev.clientY + 8) + 'px';
  document.body.appendChild(ghost);

  const panel = document.getElementById('plan-panel');
  const move = e => {
    ghost.style.left = (e.clientX + 8) + 'px';
    ghost.style.top = (e.clientY + 8) + 'px';
    // 进入 / 离开计划面板时高亮
    const r = panel.getBoundingClientRect();
    panel.classList.toggle('dragover', e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom);
  };
  const up = e => {
    const r = panel.getBoundingClientRect();
    const dropped = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
    ghost.remove();
    panel.classList.remove('dragover');
    document.removeEventListener('mousemove', move);
    document.removeEventListener('mouseup', up);
    if (dropped) addPlanFromTask(id);
  };

function dueRowHTML(t) {
  const c = t.courseId ? courseById(t.courseId) : null;
  const due = t.due || todayStr();
  const cls = dueClass(due);
  const tag = t.kind === 'short'
    ? typeTagHTML(t.type)
    : `<span class="task-tag tag-long">长期</span>`;
  const diff = Math.round((new Date(due + 'T00:00:00') - new Date(todayStr() + 'T00:00:00')) / 86400000);
  let days;
  if (diff < 0)        days = `<span class="due-days overdue">逾期 ${-diff} 天</span>`;
  else if (diff === 0) days = `<span class="due-days today">今天</span>`;
  else if (diff <= 3)  days = `<span class="due-days soon">${diff} 天后</span>`;
  else                 days = `<span class="due-days">${diff} 天后</span>`;
  return `
    <div class="due-row ${t.done ? 'done' : ''}">
      <div class="due-line">
        <span class="plan-grip" title="按住拖到「今日计划」" onmousedown="event.stopPropagation();startPlanDrag(event,'${t.id}')">⠿</span>
        <span class="chk ${t.done ? 'checked' : ''}" onclick="toggleAnyTask('${t.kind}','${t.id}')"></span>
        ${t.kind === 'long' && t.priority ? `<span class="pri-dot pri-${t.priority}"></span>` : ''}
        <span class="due-title" contenteditable="true" onblur="renameAnyTask('${t.kind}','${t.id}', this.textContent)">${t.title}</span>
        ${c ? `<span class="lt-course-tag" style="background:${c.color}22;color:${c.color}">${c.short}</span>` : ''}
        ${tag}
        ${remindHTML(t.id, t.remind)}
        ${days}
        <span class="task-due ${cls}" title="点击修改截止日期" onclick="openDatePicker(this, event)">
          <input type="date" value="${due}" onchange="setAnyDue('${t.kind}','${t.id}', this.value)"/>
        </span>
        <span class="task-del" style="opacity:1" onclick="delAnyTask('${t.kind}','${t.id}')">×</span>
      </div>
      ${noteHTML(t.kind, t.id, t.note, '')}
    </div>`;
}

function renderDue() {
  const el = document.getElementById('due-list');
  if (!el) return;
  const today = todayStr();
  const soon = addDaysStr(3);

  // 越紧急越靠上：先按截止日期，再按优先级
  const byDue = (a, b) => {
    const da = a.due || '9999-99-99', db = b.due || '9999-99-99';
    if (da !== db) return da.localeCompare(db);
    const rank = { high: 0, med: 1, low: 2 };
    return (rank[a.priority] ?? 1) - (rank[b.priority] ?? 1);
  };

  const all = collectAllTasks();
  if (all.length === 0) { el.innerHTML = `<div class="due-empty">还没有任何任务</div>`; return; }
  const pending = all.filter(t => !t.done).sort(byDue);
  const done = all.filter(t => t.done).sort(byDue);

  const bands = [
    { label: '已逾期',   cls: 'overdue', test: t => t.due && t.due < today },
    { label: '今天到期', cls: 'today',   test: t => !t.due || t.due === today },
    { label: '3 天内',   cls: 'soon',    test: t => t.due > today && t.due <= soon },
    { label: '更远',     cls: '',        test: t => t.due > soon },
  ];

  let html = bands.map(b => {
    const items = pending.filter(b.test);
    if (!items.length) return '';
    return `
      <div class="due-group">
        <div class="due-group-head">
          <span class="dg-name ${b.cls}">${b.label}</span>
          <span class="dg-count">${items.length}</span>
        </div>
        <div class="due-list">${items.map(dueRowHTML).join('')}</div>
      </div>`;
  }).join('');

  if (done.length) {
    html += `
      <div class="due-group">
        <div class="due-group-head archive-head" onclick="toggleDoneArchive()">
          <span class="archive-caret">▸</span>
          <span class="dg-name">已完成</span>
          <span class="dg-count">${done.length}</span>
          <span class="archive-tip">点击展开</span>
        </div>
        <div class="due-list" id="archive-done" style="display:none">${done.map(dueRowHTML).join('')}</div>
      </div>`;
  }

  el.innerHTML = html || `<div class="due-empty">所有任务都完成了 🎉</div>`;
}

  const isFuture = dateStr > todayStr();
  setViewDate(dateStr, dateStr !== todayStr());
  switchTab('today');
  requestAnimationFrame(() => {

// [2,3,4,5,7,...,18] -> "2-5,7-18"
function weeksToStr(weeks) {
  if (!weeks || !weeks.length) return '';
  const s = [...weeks].sort((a,b)=>a-b);
  const parts = [];
  let a = s[0], b = s[0];
  for (let i = 1; i < s.length; i++) {
    if (s[i] === b + 1) { b = s[i]; }
    else { parts.push(a === b ? `${a}` : `${a}-${b}`); a = b = s[i]; }
  }
  parts.push(a === b ? `${a}` : `${a}-${b}`);
  return parts.join(',');
}

  n += state.longTerm.filter(l => l.courseId === courseId).length;
  return n;
}

      </div>
      ${isWork(c)
        ? `<div class="cec-slots"><div class="cec-slots-label">学生工作</div><div style="font-size:12px;color:var(--text-3);padding:2px 0">不需要教室和上课时间，也不会自动生成任务 —— 任务请手动添加</div></div>`
        : `<label class="cec-toggle">
        <input type="checkbox" ${autoGenOf(c) ? 'checked' : ''} onchange="editingCourses[${i}].autoGen=this.checked"/>
        上课后自动生成课后任务${needsReview(c) ? '（作业 + 复习）' : '（仅作业）'}
      </label>
      <div class="cec-slots">
        <div class="cec-slots-label">上课时间（决定什么时候自动生成课后任务）</div>
        ${(c.slots||[]).length === 0
          ? `<div style="font-size:12px;color:var(--text-3);padding:2px 0">未设置上课时间，这门课不会自动生成任务</div>`
          : (c.slots||[]).map((s,j) => `
            <div class="slot-row">
              <span class="grow">${DAY_NAMES[s.day-1]} · 第${s.period}节</span>
              <span class="wk">第 ${weeksToStr(s.weeks)} 周</span>
              <button class="slot-x" onclick="editingCourses[${i}].slots.splice(${j},1);renderCourseEditor()">×</button>
            </div>`).join('')
        }
        <div class="slot-add">
          <select class="cec-select" id="sd-day-${i}">${DAY_NAMES.map((d,k)=>`<option value="${k+1}">${d}</option>`).join('')}</select>
          <select class="cec-select" id="sd-period-${i}">${PERIOD_OPTIONS.map(p=>`<option value="${p}">第${p}节</option>`).join('')}</select>
          <input class="cec-input wk-input" id="sd-weeks-${i}" placeholder="周次，如 2-18" />
          <button class="btn btn-ghost" style="padding:7px 12px" onclick="addSlot(${i})">添加时段</button>
        </div>
      </div>`}
      <div style="margin-top:10px;display:flex;justify-content:flex-end">
        <button class="cec-del" onclick="removeCourse(${i})">删除${isWork(c) ? '这个学生工作' : '这门课程'}</button>
      </div>
    </div>
  `).join('');
}

function addSlot(i) {
  const day = parseInt(document.getElementById('sd-day-' + i).value);
  const period = document.getElementById('sd-period-' + i).value;
  const wkStr = document.getElementById('sd-weeks-' + i).value.trim() || '2-18';
  const weeks = parseWeeks(wkStr);
  if (!weeks.length) { toast('周次格式有误，例如 2-18 或 2-5,7-18'); return; }
  if (!editingCourses[i].slots) editingCourses[i].slots = [];
  editingCourses[i].slots.push({ day, period, weeks });
  renderCourseEditor();
}

function addCourseRow() {
  editingCourses.push({ id: 'c' + uid(), name: '', short: '', color: COLORS[editingCourses.length % COLORS.length], teacher: '', room: '', category: 'humanities', slots: [] });
  renderCourseEditor();
}

// 学生工作：无教室、无上课时间、不自动生成任务
function addWorkRow() {
  editingCourses.push({ id: 'c' + uid(), name: '', short: '', color: COLORS[editingCourses.length % COLORS.length], teacher: '', room: '', category: 'work', autoGen: false, slots: [] });
  renderCourseEditor();
}

function removeCourse(i) {
  const c = editingCourses[i];
  const n = countCourseTasks(c.id);
  const msg = n > 0
    ? `确定删除「${c.name || '未命名课程'}」吗？\n该课程下的 ${n} 条任务也会一并删除，此操作不可撤销。`
    : `确定删除「${c.name || '未命名课程'}」吗？`;
  if (!confirm(msg)) return;
  editingCourses.splice(i, 1);
  renderCourseEditor();
}

function saveModal() {
  editingCourses = editingCourses.filter(c => c.name.trim());
  editingCourses.forEach(c => {
    if (!c.short) c.short = c.name.slice(0, 3);
    if (!c.category) c.category = 'humanities';
    // 学生工作：清掉教室与上课时间，并确保不自动生成
    if (c.category === 'work') { c.slots = []; c.room = ''; c.autoGen = false; }
    if (!c.slots) c.slots = [];
  });

  // 被删除的课程：同步清理其任务
  const removedIds = state.courses
    .filter(o => !editingCourses.some(c => c.id === o.id))
    .map(o => o.id);
  removedIds.forEach(id => {
    Object.keys(state.shortTerm).forEach(d => {
      state.shortTerm[d] = state.shortTerm[d].filter(t => t.courseId !== id);
    });
    state.longTerm = state.longTerm.filter(l => l.courseId !== id);
  });

  state.courses = editingCourses;

  // 当前选中的课程被删掉了 → 退回今日
  if (state.selectedCourse && removedIds.includes(state.selectedCourse)) {
    state.selectedCourse = null;
    closeModal();
    switchTab('today');
    save(); render();
    toast('已删除课程，并退回今日视图');
    return;
  }

  save();
  backfillWeek();
  closeModal();
  render();
  toast(removedIds.length ? `已保存，删除 ${removedIds.length} 门课程` : '已保存课程设置');
}

document.getElementById('manage-courses-btn').addEventListener('click', openModal);
document.getElementById('add-course-btn').addEventListener('click', () => { openModal(); addCourseRow(); });
document.getElementById('date-picker').addEventListener('change', e => {
  if (e.target.value) setViewDate(e.target.value, true);
});
document.getElementById('today-btn').addEventListener('click', () => {
  setViewDate(todayStr(), false);
  toast('已回到今天');
});
document.getElementById('sync-btn').addEventListener('click', syncNow);

// 跨天自动更新：页面一直开着跨过零点，或从后台切回来时，自动切到当天
function syncToRealToday(notify) {
  if (state.viewPinned) return;                 // 用户手动选了日期，不打扰
  if (state.currentDate === todayStr()) return; // 已经是今天，无需处理
  state.currentDate = todayStr();
  backfillWeek();
  save();
  render();
  checkReminders();
  if (notify) toast('日期已自动更新到 ' + fmtDateCN(state.currentDate));
}
setInterval(() => syncToRealToday(true), 60000);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) syncToRealToday(false);
});
document.getElementById('modal').addEventListener('click', e => { if (e.target.id==='modal') closeModal(); });

/* ===================== Init ===================== */
render();
checkReminders();
syncNow();   // 启动后从云端拉取一次，有网即自动多端同步
</script>
</body>
</html>
